# VAPA Object-Specific Tactile Grip Profiles
# Selected ONLY at the onset of grasp closure.
# Mid-grasp updates may ONLY LOWER the force ceiling (monotonic safety constraint).
# Perception NEVER initiates motion on its own.
# NOTE: All profile force values are marked TODO(calibrate).
# Dangerous sharp objects (knife, scissors) are explicitly prohibited from custom
# grip profiles; they strictly fall back to default power grasp only.

default:
  target_force_n: 3.5   # TODO(calibrate)
  force_ceiling_n: 7.0  # TODO(calibrate)
  grasp_type: "POWER"
  speed_scale: 0.8
  aperture_ratio: 1.0

