# VAPA YOLO Fine-Tuning Hyperparameters & Augmentations Configuration
# Designed for robust RealSense D435i robotic perception:
# Includes realistic camera noise, hand occlusion, scale jitter, and lighting shifts.

task: detect
mode: train
model: yolov8n.pt
data: data/yolo_dataset/data.yaml

# Training Schedule & Optimization
epochs: 100
patience: 15          # Early stopping patience
batch: 16             # Batch size (adjust based on GPU VRAM)
imgsz: 640            # RealSense RGB resolution matches 640x480 native aspect
save: true
save_period: 10
cache: false
device: 0             # Set to GPU ID or 'cpu' if dry-running
workers: 4
project: runs/train
name: vapa_yolo_finetune
seed: 42
deterministic: true
single_cls: false
rect: false
cos_lr: true
close_mosaic: 10

# Hyperparameters (Optimized for transfer learning & fine-tuning)
lr0: 0.005            # Initial learning rate
lrf: 0.01             # Final learning rate fraction
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5

# Real-Camera Physical Augmentations
# Matches indoor ambient lighting, table reflections, blur, and hand occlusions
hsv_h: 0.015          # Slight color tint variation
hsv_s: 0.7            # Saturation jitter
hsv_v: 0.4            # Brightness jitter (harsh shadows to dim desk lamps)
degrees: 10.0         # Small rotational tilts
translate: 0.1        # Spatial translations
scale: 0.5            # Distance scaling (0.3m to 1.5m depth simulation)
shear: 2.0
perspective: 0.0005
flipud: 0.0           # Prosthetic arm grasps upright/tabletop objects
fliplr: 0.5           # Bilateral mirror invariance
mosaic: 0.5           # Context mixing
mixup: 0.1
copy_paste: 0.1       # Synthetic tabletop clutter
erasing: 0.4          # Cutout / occlusion simulation (prosthetic fingers or human hands entering frame)
